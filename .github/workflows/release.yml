# AEGIS client — сборка релиза + публикация контрольных сумм/подписи (P9, §12.1).
#
# По тегу vX.Y.Z: собирает release-APK, считает SHA256SUMS, ПОДПИСЫВАЕТ их
# GPG-ключом проекта (если задан секрет), и прикладывает всё к GitHub Release.
# Пользователь проверяет подпись/сумму по README.md, раздел «Публикация и проверка контрольных сумм».
#
# ВАЖНО (§12.1): секреты подписи НИКОГДА не коммитятся. Ключ подписи APK
# (ANDROID_KEYSTORE_*) и GPG-ключ (GPG_PRIVATE_KEY) берутся из GitHub Secrets.
# Если секретов нет — release-APK собирается НЕПОДПИСАННЫМ (см. app/build.gradle.kts),
# а SHA256SUMS остаётся без GPG-подписи (шаг подписи best-effort).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      abis:
        description: "ABI через запятую"
        default: "arm64-v8a,x86_64"
        required: false

permissions:
  contents: write # для создания GitHub Release и заливки артефактов

jobs:
  build-release:
    name: assembleRelease · checksums · signature
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: sdkmanager --install "ndk;30.0.15729638" "cmake;3.22.1"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust toolchain & cargo-ndk
        run: |
          ( cd rust/aegis-core && rustc --version )
          cargo install cargo-ndk --locked

      - name: Set up Go (pluggable transports)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Восстановление keystore подписи APK из секрета (опционально).
      - name: Restore signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > keystore.properties

      # Полная сборка: реальные .so (Rust с signal,tor best-effort) + PT + C++-шим.
      - name: Assemble release APK
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
        run: >-
          ./gradlew --no-daemon clean :app:assembleRelease
          -Paegis.abiFilters="${{ github.event.inputs.abis || 'arm64-v8a,x86_64' }}"

      # Импорт GPG-ключа проекта для подписи SHA256SUMS (опционально).
      - name: Import GPG signing key
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Generate checksums & signature
        env:
          AEGIS_GPG_KEY: ${{ secrets.GPG_KEY_ID }}
          OUT_DIR: dist
        run: bash scripts/publish-checksums.sh app/build/outputs/apk/release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aegis-release
          path: |
            app/build/outputs/apk/release/*.apk
            dist/SHA256SUMS*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
          body: |
            AEGIS release ${{ github.ref_name }}.

            Проверка целостности (см. README.md, «Публикация и проверка контрольных сумм»):
            ```
            sha256sum -c SHA256SUMS
            gpg --verify SHA256SUMS.asc SHA256SUMS
            apksigner verify --print-certs <artifact>.apk
            ```
          fail_on_unmatched_files: false
