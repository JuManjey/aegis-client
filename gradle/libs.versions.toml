#
# AEGIS — единый каталог версий (Gradle Version Catalog).
# Все версии зависимостей и плагинов держим ЗДЕСЬ, а не разбросанными по модулям.
# Это упрощает аудит зависимостей (требование §1 технического задания) и обновление.
#
[versions]
# --- Сборка ---
agp = "8.11.1"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"

# --- Android SDK ---
compileSdk = "36"
targetSdk = "36"
minSdk = "26"
# NDK, установленный в окружении (§15.2). Фиксируем явно, чтобы AGP не брал
# свою дефолтную версию (иначе предупреждения CXX1104 и проблемы со strip).
ndk = "30.0.15729638"

# --- AndroidX / Compose ---
androidxCore = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
# androidx.fragment: явно фиксируем совместимую с activity 1.9.x версию.
# Транзитивно biometric-ktx:1.2.0-alpha05 тянет старый fragment 1.2.5, чей
# FragmentActivity валидирует requestCode «только младшие 16 бит», а
# ActivityResultRegistry из activity 1.9.x генерирует коды ≥ 0x10000 —
# это роняло приложение при запросе runtime-разрешений (POST_NOTIFICATIONS).
fragment = "1.8.6"
composeBom = "2025.06.01"
navigationCompose = "2.8.5"
splashscreen = "1.0.1"

# --- Безопасность / хранилище ---
biometric = "1.2.0-alpha05"
securityCrypto = "1.1.0-alpha06"
sqlcipher = "4.6.1"
sqliteKtx = "2.4.0"

# --- DI ---
hilt = "2.52"
hiltNavigationCompose = "1.2.0"

# --- Прочее ---
kotlinxCoroutines = "1.9.0"
kotlinxSerialization = "1.7.3"
datastore = "1.1.1"

# --- QR (обмен PSK вне сети, §6.2/P4). ZXing — полностью открытый (важно для
# F-Droid, §12.1): генерация QR (core) + сканирование (android-embedded). ---
zxingCore = "3.5.3"
zxingAndroidEmbedded = "4.3.0"

# --- Звонки (P8, §7.5/§10.10): WebRTC (DTLS-SRTP). Форк webrtc-sdk с Maven
# Central-артефактом; исходники WebRTC открыты (аудит §1). Голос+видео. ---
webrtc = "125.6422.07"

# --- Тесты ---
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Compose
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Безопасность / хранилище
androidx-biometric = { group = "androidx.biometric", name = "biometric-ktx", version.ref = "biometric" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite-ktx = { group = "androidx.sqlite", name = "sqlite-ktx", version.ref = "sqliteKtx" }

# DI (Hilt)
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Coroutines / Serialization / DataStore
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# QR (обмен PSK вне сети, §6.2)
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingAndroidEmbedded" }

# Звонки: WebRTC (P8, §7.5)
webrtc = { group = "io.github.webrtc-sdk", name = "android", version.ref = "webrtc" }

# Тесты
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
