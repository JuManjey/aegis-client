# --- JVM / Gradle daemon ---
# Достаточный heap для сборки многомодульного проекта с Compose.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache отключён на ФАЗЕ 1: кастомные Exec-задачи cargo-ndk
# пока не гарантируют совместимость. Включим позже, после стабилизации.
org.gradle.configuration-cache=false

# --- Kotlin ---
kotlin.code.style=official

# --- AndroidX ---
android.useAndroidX=true
android.nonTransitiveRClasses=true

# --- Сборка нативного Rust-модуля через cargo-ndk ---
# Список ABI, под которые собираем нативные .so.
# arm64-v8a — приоритетный (все современные устройства), x86_64 — эмулятор.
# Можно переопределить из командной строки: -Paegis.abiFilters=arm64-v8a
aegis.abiFilters=arm64-v8a,x86_64

# Onion v3 ВАШЕГО релея (сервер aegis-server). Это публичный адрес (как домен):
# впишите его сюда, и любая сборка сразу будет знать, куда подключаться. Пусто —
# приложение покажет «адрес onion-релея не задан», и адрес придётся ввести вручную
# (Настройки → Сеть и Tor). Значение с сервера:
#   docker compose exec -T tor cat /var/lib/tor/aegis/hostname
# Переопределение: -Paegis.defaultRelayOnion=<hs>.onion
aegis.defaultRelayOnion=
# Публичный Ed25519 ключ проверки GET /v1/config (64 hex). Пусто = sync выкл.
# Приватный ключ сюда НЕ кладётся. Переопределение: -Paegis.relayConfigPubkey=
aegis.relayConfigPubkey=

# HTTPS-адрес ТОГО ЖЕ релея для режима «Tor ВЫКЛ» (клирнет-фронт Caddy из
# aegis-server/docker-compose.clearnet.yml). Только https://host[:port].
# Пусто — в режиме без Tor адрес вводится вручную.
# Переопределение: -Paegis.defaultRelayHttps=https://<домен>
aegis.defaultRelayHttps=
# Пины SPKI HTTPS-релея (sha256/<base64>, через запятую). Пусто = только системная
# проверка цепочки и имени. Пинить ключи корней CA (Let's Encrypt: ISRG Root X1 и X2),
# не листа — см. README.md, раздел «Пины SPKI». Опечатка в пине — ошибка сборки.
aegis.relayHttpsPins=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
